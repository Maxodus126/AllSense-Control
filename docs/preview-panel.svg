<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c10"/><stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4356"/><stop offset="1" stop-color="#ff7a4d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="860" height="540" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="260" fill="#ff4356" opacity="0.06"/>
  <circle cx="80" cy="520" r="240" fill="#4d8dff" opacity="0.06"/>

  <!-- panel -->
  <g filter="url(#shadow)">
    <rect x="430" y="30" width="400" height="480" rx="22" fill="#0e1017" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- header -->
    <g>
      <rect x="452" y="52" width="40" height="40" rx="12" fill="#ff4356" opacity="0.16" stroke="#ff4356" stroke-opacity="0.5"/>
      <path d="M468 58 456 74h8l-3 10 12-14h-8l3-12Z" fill="#ff4356"/>
      <text x="506" y="70" font-size="16" font-weight="700" fill="#eef0f5">AllSense Control</text>
      <rect x="730" y="58" width="78" height="24" rx="12" fill="#161a23" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="769" y="74" font-size="12" text-anchor="middle" fill="#97a0ae">v1.0.4</text>
    </g>

    <!-- mode cards -->
    <text x="452" y="124" font-size="11" font-weight="700" fill="#596272">MODE DAYA</text>
    <g font-size="13">
      <rect x="452" y="136" width="116" height="74" rx="12" fill="#161a23" stroke="#ffb020" stroke-opacity="0.5"/>
      <text x="510" y="162" text-anchor="middle" font-weight="700" fill="#ffb020">HEMAT</text>
      <text x="510" y="180" text-anchor="middle" font-size="10" fill="#596272">EFFICIENCY</text>
      <rect x="586" y="136" width="116" height="74" rx="12" fill="#ff4d8dff" fill-opacity="0.14" stroke="#4d8dff" stroke-opacity="0.55"/>
      <text x="644" y="162" text-anchor="middle" font-weight="700" fill="#4d8dff">BALANCED</text>
      <text x="644" y="180" text-anchor="middle" font-size="10" fill="#596272">STANDARD</text>
      <rect x="720" y="136" width="88" height="74" rx="12" fill="#161a23" stroke="#ff4356" stroke-opacity="0.4"/>
      <text x="764" y="162" text-anchor="middle" font-weight="700" fill="#97a0ae">TURBO</text>
      <text x="764" y="180" text-anchor="middle" font-size="10" fill="#596272">PERFORMANCE</text>
    </g>

    <!-- divider -->
    <line x1="452" y1="228" x2="808" y2="228" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- brightness -->
    <text x="452" y="254" font-size="11" font-weight="700" fill="#596272">KECERAHAN</text>
    <g>
      <rect x="452" y="266" width="356" height="6" rx="3" fill="#1a1e28"/>
      <rect x="452" y="266" width="230" height="6" rx="3" fill="#ffb020"/>
      <circle cx="682" cy="269" r="8" fill="#f5f7fb" stroke="#0e1017" stroke-width="3"/>
      <text x="808" y="274" font-size="14" font-weight="600" fill="#eef0f5" text-anchor="end">64%</text>
    </g>

    <!-- volume -->
    <text x="452" y="312" font-size="11" font-weight="700" fill="#596272">VOLUME</text>
    <g>
      <rect x="452" y="324" width="356" height="6" rx="3" fill="#1a1e28"/>
      <rect x="452" y="324" width="330" height="6" rx="3" fill="#ff4356"/>
      <circle cx="782" cy="327" r="8" fill="#f5f7fb" stroke="#0e1017" stroke-width="3"/>
      <text x="808" y="332" font-size="14" font-weight="600" fill="#eef0f5" text-anchor="end">92%</text>
    </g>

    <!-- battery chip -->
    <g>
      <rect x="452" y="356" width="356" height="44" rx="12" fill="#161a23" stroke="#35c973" stroke-opacity="0.4"/>
      <circle cx="474" cy="378" r="5" fill="#35c973"/>
      <text x="490" y="383" font-size="13" font-weight="600" fill="#35c973">AC · 100%</text>
      <text x="808" y="383" font-size="12" fill="#97a0ae" text-anchor="end">Baterai penuh</text>
    </g>

    <!-- settings row -->
    <g font-size="13">
      <rect x="452" y="416" width="356" height="72" rx="12" fill="#1a1e28"/>
      <text x="470" y="444" font-weight="600" fill="#eef0f5">Hotkey buka/tutup</text>
      <rect x="700" y="430" width="90" height="26" rx="8" fill="#0e1017" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="745" y="447" font-size="12" text-anchor="middle" fill="#97a0ae">Ctrl+Alt+A</text>
      <text x="470" y="476" font-weight="600" fill="#eef0f5">Auto Hemat di baterai</text>
      <g transform="translate(740 462)">
        <rect width="46" height="24" rx="12" fill="#ff4356"/>
        <circle cx="35" cy="12" r="9" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- caption -->
  <text x="430" y="530" font-size="13" fill="#97a0ae" text-anchor="middle">Panel ter-dock di kanan layar · OSD muncul saat ganti mode</text>
</svg>
