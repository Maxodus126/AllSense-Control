name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish AllSense.App (single-file)
        run: dotnet publish app/AllSense.App/AllSense.App.csproj -c Release -o publish/app --nologo

      - name: Publish Installer (single-file)
        run: dotnet publish app/Installer/Installer.csproj -c Release -o publish/installer --nologo

      - name: Stage release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item publish\installer\AllSenseSetup.exe "bundle\AllSense setup.exe"
          Copy-Item publish\app\AllSense.exe "bundle\AllSense.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Rilis otomatis AllSense Control ${{ github.ref_name }}.
            - `AllSense setup.exe` — installer (dengan konfirmasi pemasangan)
            - `AllSense.exe` — payload untuk self-update
          files: |
            bundle/AllSense setup.exe
            bundle/AllSense.exe
          fail_on_unmatched_files: true
