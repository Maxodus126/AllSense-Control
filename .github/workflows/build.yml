name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build AllSense.App
        run: dotnet build app/AllSense.App/AllSense.App.csproj -c Release --nologo

      - name: Build Uninstall
        run: dotnet build app/Uninstall/Uninstall.csproj -c Release --nologo

      - name: Build Installer
        run: dotnet build app/Installer/Installer.csproj -c Release --nologo

      - name: Publish AllSense.App (single-file)
        run: dotnet publish app/AllSense.App/AllSense.App.csproj -c Release -o publish/app --nologo

      - name: Upload AllSense artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllSense-win-x64
          path: publish/app/AllSense.exe
