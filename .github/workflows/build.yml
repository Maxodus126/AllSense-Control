name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build AllSense.App
        run: dotnet build app/AllSense.App/AllSense.App.csproj -c Release --nologo

      - name: Build Installer
        run: dotnet build app/Installer/Installer.csproj -c Release --nologo
